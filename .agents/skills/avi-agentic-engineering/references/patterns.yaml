schema_version: 1
catalog: avi-agentic
id_prefix: AVI-AGENT
canonical_loop: >
  Intent → Coordinator → scoped context/knowledge → specialist agents →
  policy-gated capabilities/MCP → deterministic execution → verification →
  independent review → human gate where required → artifact/PR → audit + memory update
structural: >
  Lean project core + overlays + PROJECT.yaml + AGENTS.md + avi-* skills +
  project KB + GitHub execution state + Asana project state + MCP bus +
  model router + policy/audit control plane

categories:
  orchestration: { range: [1, 6] }
  implementation: { range: [7, 11] }
  integration: { range: [12, 16] }
  safety: { range: [17, 23] }
  isolation: { range: [24, 26] }
  quality: { range: [27, 30] }
  knowledge: { range: [31, 40] }
  browser: { range: [41, 45] }
  models: { range: [46, 50] }
  project_management: { range: [51, 54] }
  unifying: { range: [55, 60] }

